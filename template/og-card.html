<!doctype html>
<!-- The link-preview card tools/og-image.mjs renders to articles/<slug>/assets/og.png
     (1200 x 630). Light scheme only: the messaging apps that show it never ask for
     dark. Placeholders: {{title}}, {{description}}, {{poster}} (the article's hero
     poster markup), {{palette}} (the article's palette <style>, so var(--c-*)
     resolves inside the poster), {{css}} (dist/explainers.v1.css relative to the
     card), {{title-size}} (px, from the title length). -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<title>{{title}}</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Source+Sans+3:wght@400;600&display=swap">
<link rel="stylesheet" href="{{css}}">
{{palette}}
<style>
  :root { color-scheme: light; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { background: var(--bg); color: var(--fg); font-family: var(--x-serif); }
  .card { box-sizing: border-box; width: 1200px; height: 630px; padding: 56px 60px; display: grid; grid-template-columns: minmax(0, 1fr) 540px; column-gap: 48px; align-items: center; }
  .text { min-width: 0; }
  .site { font: 600 24px/1.2 var(--x-sans); color: var(--x-muted); letter-spacing: 0.02em; margin: 0 0 26px; }
  h1 { font: 600 {{title-size}}px/1.08 var(--x-sans); letter-spacing: -0.015em; margin: 0 0 26px; overflow-wrap: break-word; }
  .lede { font: 400 24px/1.4 var(--x-serif); color: var(--x-muted); margin: 0; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  .poster { width: 540px; height: 518px; display: flex; align-items: center; justify-content: center; }
  .poster svg { display: block; width: 100%; height: 100%; }
  .poster img { display: block; max-width: 100%; max-height: 100%; width: auto; height: auto; }
</style>
</head>
<body>
<div class="card">
  <div class="text">
    <p class="site">explainers.sweedler.com</p>
    <h1>{{title}}</h1>
    <p class="lede">{{description}}</p>
  </div>
  <div class="poster">{{poster}}</div>
</div>
</body>
</html>
