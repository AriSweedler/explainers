name: pages
on:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Unit tests
        run: npm test
      - name: Validate every article (schema, glossary, math, budget)
        run: |
          shopt -s nullglob
          files=(articles/*/index.html)
          if [ ${#files[@]} -gt 0 ]; then node tools/explainers.cjs validate "${files[@]}" --budget 170k; else echo "no articles yet"; fi
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v5
